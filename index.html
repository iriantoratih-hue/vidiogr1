<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindAR Video Overlay</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }

      #ui {
        position: fixed;
        z-index: 10;
        top: 16px;
        left: 16px;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 14px;
        background: #ffffff;
        color: #111;
        cursor: pointer;
      }

      #status {
        color: #fff;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.45);
        padding: 10px 12px;
        border-radius: 10px;
      }

      a-scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="ui">
      <button id="startButton">Start AR</button>
      <div id="status">Siap</div>
    </div>

    <a-scene
      id="scene"
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video
          id="arVideo"
          src="./video.mp4"
          preload="auto"
          loop
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-plane
          id="videoPlane"
          src="#arVideo"
          position="0 0 0"
          rotation="0 0 0"
          width="1"
          height="0.5625"
        ></a-plane>
      </a-entity>
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const sceneEl = document.querySelector("#scene");
        const targetEl = document.querySelector("#target");
        const startButton = document.querySelector("#startButton");
        const statusEl = document.querySelector("#status");
        const video = document.querySelector("#arVideo");

        let arSystem = null;

        sceneEl.addEventListener("loaded", () => {
          arSystem = sceneEl.systems["mindar-image-system"];
        });

        startButton.addEventListener("click", async () => {
          if (!arSystem) return;
          try {
            statusEl.textContent = "Memulai kamera...";
            await arSystem.start();
            statusEl.textContent = "Arahkan kamera ke foto target";
          } catch (err) {
            console.error(err);
            statusEl.textContent = "Gagal memulai AR";
          }
        });

        targetEl.addEventListener("targetFound", async () => {
          statusEl.textContent = "Target terdeteksi";
          try {
            video.currentTime = 0;
            await video.play();
          } catch (err) {
            console.error("Video tidak bisa diputar:", err);
          }
        });

        targetEl.addEventListener("targetLost", () => {
          statusEl.textContent = "Target hilang";
          video.pause();
        });
      });
    </script>
  </body>
</html>
